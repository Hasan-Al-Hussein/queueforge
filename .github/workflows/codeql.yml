name: code-scanning

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: read

concurrency:
  group: queueforge-codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codeql:
    name: CodeQL (JavaScript and TypeScript)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Initialize CodeQL
        uses: github/codeql-action/init@42947a340483f03ba47bb1a039b2c519aab3df85 # v3.37.8
        with:
          languages: javascript-typescript
          queries: security-extended

      - name: Analyze
        uses: github/codeql-action/analyze@42947a340483f03ba47bb1a039b2c519aab3df85 # v3.37.8
