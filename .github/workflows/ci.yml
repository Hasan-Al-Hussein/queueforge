name: local-engineering-gate

on:
  push:
    branches: [main, 'codex/**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: queueforge-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality, build, and integration
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17.11-alpine
        env:
          POSTGRES_DB: queueforge
          POSTGRES_USER: queueforge_owner
          POSTGRES_PASSWORD: queueforge_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U queueforge_owner -d queueforge"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
      redis:
        image: redis:8.6.5-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      NODE_ENV: test
      APP_MODE: test
      API_HOST: 127.0.0.1
      API_PORT: 3001
      WEB_ORIGIN: http://127.0.0.1:3100
      # These are public synthetic CI-service credentials, never deployed values.
      # secretlint-disable
      DATABASE_URL: postgresql://queueforge_app:queueforge_ci_app_only@127.0.0.1:5432/queueforge
      MIGRATION_DATABASE_URL: postgresql://queueforge_owner:queueforge_ci_only@127.0.0.1:5432/queueforge
      TEST_DATABASE_URL: postgresql://queueforge_app:queueforge_ci_app_only@127.0.0.1:5432/queueforge
      TEST_MIGRATION_DATABASE_URL: postgresql://queueforge_owner:queueforge_ci_only@127.0.0.1:5432/queueforge
      # secretlint-enable
      REDIS_URL: redis://127.0.0.1:6379/0
      TEST_REDIS_URL: redis://127.0.0.1:6379/0
      BOOTSTRAP_ADMIN_EMAIL: admin@queueforge.test
      BOOTSTRAP_ADMIN_PASSWORD: synthetic-ci-password-only
      BOOTSTRAP_TENANT_SLUG: acme-demo
      NEXT_PUBLIC_API_URL: http://127.0.0.1:3001
      NEXT_PUBLIC_GRAPHQL_URL: http://127.0.0.1:3001/graphql
      SINK_HOST: 127.0.0.1
      SINK_PORT: 3300
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Configure Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.19.0

      - name: Activate pinned pnpm
        run: corepack enable && corepack prepare pnpm@11.23.0 --activate

      - name: Generate ephemeral CI secrets
        run: >-
          node -e "const c=require('node:crypto'),f=require('node:fs');
          const token=()=>c.randomBytes(48).toString('base64url');
          const entries=[['JWT_ACCESS_SECRET',token()],['REFRESH_TOKEN_PEPPER',token()],
          ['WEBHOOK_MASTER_KEY',c.randomBytes(32).toString('base64')],['SINK_SECRET',token()]];
          for(const [,value] of entries)console.log('::add-mask::'+value);
          f.appendFileSync(process.env.GITHUB_ENV,entries.map(([name,value])=>name+'='+value).join('\n')+'\n')"

      - name: Install exact dependencies
        run: pnpm install --frozen-lockfile

      - name: Static quality gate
        run: pnpm bootstrap && pnpm format:check && pnpm lint:inner && pnpm typecheck:inner

      - name: Unit and build gate
        run: pnpm test:unit:inner && pnpm build

      - name: Frontend accessibility and Storybook gate
        run: pnpm test:a11y && pnpm --filter @queueforge/web build-storybook

      # The following values authenticate only the disposable CI service above.
      # secretlint-disable
      - name: Create least-privilege runtime database role
        env:
          PGPASSWORD: queueforge_ci_only
        run: |
          psql --host 127.0.0.1 --username queueforge_owner --dbname queueforge --set ON_ERROR_STOP=1 <<'SQL'
          DO $queueforge$
          BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'queueforge_app') THEN
              CREATE ROLE queueforge_app LOGIN PASSWORD 'queueforge_ci_app_only';
            END IF;
          END
          $queueforge$;
          SQL
      # secretlint-enable

      - name: Database migration and integration gate
        run: pnpm db:migrate && pnpm test:integration

      - name: Secret scan
        run: pnpm audit:deps && pnpm audit:secrets && pnpm test:load:security

      - name: Preserve test evidence on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: queueforge-failure-evidence
          path: |
            coverage
            test-results
            artifacts/verification
          if-no-files-found: ignore
          retention-days: 7

  browser:
    name: Browser journey and bounded load smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17.11-alpine
        env:
          POSTGRES_DB: queueforge
          POSTGRES_USER: queueforge_owner
          POSTGRES_PASSWORD: queueforge_ci_only
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U queueforge_owner -d queueforge"
          --health-interval 5s --health-timeout 3s --health-retries 12
      redis:
        image: redis:8.6.5-alpine
        ports: [6379:6379]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 12
    env:
      NODE_ENV: test
      APP_MODE: test
      API_HOST: 127.0.0.1
      API_PORT: 3001
      WEB_ORIGIN: http://127.0.0.1:3100
      # These are public synthetic CI-service credentials, never deployed values.
      # secretlint-disable
      DATABASE_URL: postgresql://queueforge_app:queueforge_ci_app_only@127.0.0.1:5432/queueforge
      MIGRATION_DATABASE_URL: postgresql://queueforge_owner:queueforge_ci_only@127.0.0.1:5432/queueforge
      # secretlint-enable
      REDIS_URL: redis://127.0.0.1:6379/0
      BOOTSTRAP_ADMIN_EMAIL: admin@queueforge.test
      BOOTSTRAP_ADMIN_PASSWORD: synthetic-ci-password-only
      BOOTSTRAP_TENANT_SLUG: acme-demo
      NEXT_PUBLIC_API_URL: http://127.0.0.1:3001
      NEXT_PUBLIC_GRAPHQL_URL: http://127.0.0.1:3001/graphql
      SINK_HOST: 127.0.0.1
      SINK_PORT: 3300
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Configure Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.19.0

      - name: Activate pinned pnpm
        run: corepack enable && corepack prepare pnpm@11.23.0 --activate

      - name: Generate ephemeral browser-test secrets
        run: >-
          node -e "const c=require('node:crypto'),f=require('node:fs');
          const token=()=>c.randomBytes(48).toString('base64url');
          const entries=[['JWT_ACCESS_SECRET',token()],['REFRESH_TOKEN_PEPPER',token()],
          ['WEBHOOK_MASTER_KEY',c.randomBytes(32).toString('base64')],['SINK_SECRET',token()]];
          for(const [,value] of entries)console.log('::add-mask::'+value);
          f.appendFileSync(process.env.GITHUB_ENV,entries.map(([name,value])=>name+'='+value).join('\n')+'\n')"

      - name: Install, build, and prepare the disposable database
        run: |
          pnpm install --frozen-lockfile
          pnpm bootstrap
          PGPASSWORD=queueforge_ci_only psql --host 127.0.0.1 --username queueforge_owner --dbname queueforge --set ON_ERROR_STOP=1 <<'SQL'
          DO $queueforge$
          BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'queueforge_app') THEN
              CREATE ROLE queueforge_app LOGIN PASSWORD 'queueforge_ci_app_only';
            END IF;
          END
          $queueforge$;
          SQL
          pnpm db:migrate
          pnpm db:seed

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Start the loopback application topology
        run: |
          nohup node apps/webhook-sink/dist/main.js > /tmp/queueforge-sink.log 2>&1 &
          nohup node apps/api/dist/main.js > /tmp/queueforge-api.log 2>&1 &
          nohup node apps/worker/dist/main.js > /tmp/queueforge-worker.log 2>&1 &
          nohup pnpm --filter @queueforge/web start > /tmp/queueforge-web.log 2>&1 &
          for endpoint in \
            http://127.0.0.1:3001/api/v1/health/ready \
            http://127.0.0.1:3300/health \
            http://127.0.0.1:3100; do
            for attempt in $(seq 1 60); do
              curl --fail --silent --show-error "$endpoint" >/dev/null && break
              test "$attempt" -lt 60 || exit 1
              sleep 1
            done
          done

      - name: Run the real browser journey
        run: pnpm test:e2e:inner

      - name: Run pinned k6 smoke in an isolated container
        run: |
          mkdir -p test-results/k6
          docker run --rm --network host \
            -v "$PWD:/work" -w /work \
            -e K6_API_URL=http://127.0.0.1:3001 \
            -e K6_WEB_ORIGIN=http://127.0.0.1:3100 \
            -e K6_PROFILE=smoke \
            -e K6_SUMMARY_PATH=/work/test-results/k6/ci-smoke-summary.json \
            -e BOOTSTRAP_ADMIN_EMAIL -e BOOTSTRAP_ADMIN_PASSWORD \
            -e BOOTSTRAP_TENANT_SLUG -e SINK_SECRET \
            grafana/k6:2.2.0 run load-tests/queueforge.spec.ts
          pnpm test:load:security

      - name: Preserve browser evidence on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: queueforge-browser-failure-evidence
          path: |
            tests/e2e/playwright-report
            tests/e2e/test-results
            test-results/k6
          if-no-files-found: ignore
          retention-days: 7
