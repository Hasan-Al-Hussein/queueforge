name: public-exposure-gate

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/exposure-gate.yml'
      - 'apps/web/package.json'
      - 'pnpm-lock.yaml'
      - 'scripts/check-next-security-gate.ts'
      - 'scripts/next-security-gate.json'

permissions:
  contents: read

concurrency:
  group: queueforge-exposure-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vendor-security-gate:
    name: Block public exposure until the vendor gate closes
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Configure Node.js and pinned pnpm
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.19.0

      - name: Activate pinned pnpm
        run: corepack enable && corepack prepare pnpm@11.23.0 --activate

      - name: Install exact dependencies
        run: pnpm install --frozen-lockfile

      - name: Fail closed while the tracked Next.js advisory gate is open
        run: pnpm security:next-gate
