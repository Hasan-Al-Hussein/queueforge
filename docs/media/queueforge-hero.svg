<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 620" role="img" aria-labelledby="title desc">
  <title id="title">QueueForge local-first workflow automation</title>
  <desc id="desc">QueueForge turns versioned requests into independently approved, durably processed, signed, and auditable outcomes on one local machine.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071826" />
      <stop offset="0.58" stop-color="#0b2740" />
      <stop offset="1" stop-color="#12384e" />
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#153a58" />
      <stop offset="1" stop-color="#102e47" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#6f91aa" stroke-width="1" opacity="0.11" />
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#020b12" flood-opacity="0.42" />
    </filter>
    <filter id="flow-glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64d7c6" />
    </marker>
    <style>
      .sans { font-family: "Segoe UI", Arial, sans-serif; }
      .stage { fill: #143b58; stroke: #39637c; stroke-width: 1.5; }
      .stage-active { fill: #183f3c; stroke: #4b8179; }
      .stage-review { fill: #3b3453; stroke: #756891; }
      .stage-title { fill: #ffffff; font: 700 17px "Segoe UI", Arial, sans-serif; }
      .stage-title-compact { fill: #ffffff; font: 700 16px "Segoe UI", Arial, sans-serif; }
      .stage-note { fill: #abc1d1; font: 400 14px "Segoe UI", Arial, sans-serif; }
      .step { fill: #0a2337; stroke-width: 2; }
      .step-text { fill: #ffffff; font: 700 14px "Segoe UI", Arial, sans-serif; text-anchor: middle; }
      .flow { fill: none; stroke: #64d7c6; stroke-width: 3.5; stroke-linecap: round; marker-end: url(#arrow); }
      .chip { fill: #102e47; stroke: #3a6079; stroke-width: 1.25; }
      .chip-text { fill: #d7e7f1; font: 700 14px "Segoe UI", Arial, sans-serif; text-anchor: middle; }
      @media (prefers-reduced-motion: reduce) { .motion-dot { display: none; } }
    </style>
  </defs>

  <rect width="1600" height="620" rx="30" fill="url(#background)" />
  <rect width="1600" height="620" rx="30" fill="url(#grid)" />
  <path d="M 0 0 H 360 L 75 620 H 0 Z" fill="#0f314c" opacity="0.28" />
  <path d="M 1600 0 H 1350 L 1600 480 Z" fill="#17635f" opacity="0.16" />

  <g transform="translate(64 64)">
    <rect width="282" height="38" rx="19" fill="#113f58" stroke="#3a8a86" stroke-width="1.5" />
    <circle cx="20" cy="19" r="6" fill="#64d7c6" />
    <text class="sans" x="38" y="25" fill="#dffbf6" font-size="14" font-weight="700" letter-spacing="1.2">LOCAL-FIRST · MULTI-TENANT</text>

    <g transform="translate(0 92)">
      <rect x="0" y="0" width="62" height="76" rx="14" fill="#102f49" stroke="#e86f2b" stroke-width="2" />
      <rect x="16" y="17" width="8" height="42" rx="4" fill="#e86f2b" />
      <rect x="30" y="8" width="8" height="59" rx="4" fill="#64d7c6" />
      <rect x="44" y="25" width="8" height="26" rx="4" fill="#e86f2b" />
      <text class="sans" x="86" y="56" fill="#ffffff" font-size="68" font-weight="750">QueueForge</text>
    </g>

    <text class="sans" x="0" y="250" fill="#ffffff" font-size="30" font-weight="700">Approve deliberately. Process durably.</text>
    <text class="sans" x="0" y="290" fill="#64d7c6" font-size="30" font-weight="700">Prove every outcome.</text>
    <text class="sans" x="0" y="344" fill="#b6cad8" font-size="19">Versioned request intake, independent human decisions,</text>
    <text class="sans" x="0" y="375" fill="#b6cad8" font-size="19">transactional handoff, bounded retry, and signed delivery.</text>

    <g transform="translate(0 418)">
      <rect class="chip" width="104" height="38" rx="9" />
      <text class="chip-text" x="52" y="25">NestJS</text>
      <rect class="chip" x="116" width="104" height="38" rx="9" />
      <text class="chip-text" x="168" y="25">Next.js</text>
      <rect class="chip" x="232" width="132" height="38" rx="9" />
      <text class="chip-text" x="298" y="25">PostgreSQL</text>
      <rect class="chip" x="376" width="104" height="38" rx="9" />
      <text class="chip-text" x="428" y="25">BullMQ</text>
      <rect class="chip" x="492" width="124" height="38" rx="9" />
      <text class="chip-text" x="554" y="25">TypeScript</text>
    </g>
  </g>

  <g transform="translate(760 52)" filter="url(#shadow)">
    <rect width="776" height="516" rx="26" fill="url(#panel)" stroke="#386079" stroke-width="1.5" />
    <text class="sans" x="36" y="48" fill="#99b5c8" font-size="14" font-weight="700" letter-spacing="1.7">EVIDENCE-BOUND DELIVERY LOOP</text>
    <rect x="580" y="24" width="160" height="34" rx="17" fill="#15394f" stroke="#e86f2b" stroke-width="1.5" />
    <circle cx="600" cy="41" r="5" fill="#e86f2b" />
    <text class="sans" x="614" y="47" fill="#ffffff" font-size="13" font-weight="700">LOOPBACK ONLY</text>

    <g transform="translate(36 86)">
      <rect class="stage" width="214" height="104" rx="16" />
      <circle class="step" cx="28" cy="28" r="17" stroke="#e86f2b" />
      <text class="step-text" x="28" y="33">1</text>
      <text class="stage-title" x="56" y="34">Versioned request</text>
      <text class="stage-note" x="20" y="67">Typed form, policy, targets,</text>
      <text class="stage-note" x="20" y="88">and immutable activation</text>
    </g>
    <path class="flow" d="M 252 138 H 292" />
    <g transform="translate(306 86)">
      <rect class="stage-review" width="214" height="104" rx="16" />
      <circle class="step" cx="28" cy="28" r="17" stroke="#b8a6e8" />
      <text class="step-text" x="28" y="33">2</text>
      <text class="stage-title" x="56" y="34">Human decision</text>
      <text class="stage-note" x="20" y="67">A separate approver checks</text>
      <text class="stage-note" x="20" y="88">the exact bound revision</text>
    </g>
    <path class="flow" d="M 522 138 H 542" />
    <g transform="translate(556 86)">
      <rect class="stage" width="184" height="104" rx="16" />
      <circle class="step" cx="28" cy="28" r="17" stroke="#e86f2b" />
      <text class="step-text" x="28" y="33">3</text>
      <text class="stage-title-compact" x="54" y="34">Atomic handoff</text>
      <text class="stage-note" x="18" y="67">State, audit, outbox</text>
      <text class="stage-note" x="18" y="88">commit together</text>
    </g>

    <path class="flow" d="M 648 192 V 238" />

    <g transform="translate(526 252)">
      <rect class="stage-active" width="214" height="104" rx="16" />
      <circle class="step" cx="28" cy="28" r="17" stroke="#64d7c6" />
      <text class="step-text" x="28" y="33">4</text>
      <text class="stage-title" x="56" y="34">Durable execution</text>
      <text class="stage-note" x="20" y="67">BullMQ coordinates bounded</text>
      <text class="stage-note" x="20" y="88">retry and lease recovery</text>
    </g>
    <path class="flow" d="M 524 304 H 484" />
    <g transform="translate(256 252)">
      <rect class="stage-active" width="214" height="104" rx="16" />
      <circle class="step" cx="28" cy="28" r="17" stroke="#64d7c6" />
      <text class="step-text" x="28" y="33">5</text>
      <text class="stage-title" x="56" y="34">Signed delivery</text>
      <text class="stage-note" x="20" y="67">Allowlisted receiver, stable</text>
      <text class="stage-note" x="20" y="88">event ID, HMAC signature</text>
    </g>
    <path class="flow" d="M 254 304 H 234" />
    <g transform="translate(36 252)">
      <rect class="stage" width="184" height="104" rx="16" />
      <circle class="step" cx="28" cy="28" r="17" stroke="#e86f2b" />
      <text class="step-text" x="28" y="33">6</text>
      <text class="stage-title" x="56" y="34">Proof</text>
      <text class="stage-note" x="20" y="67">Timeline and audit trail</text>
      <text class="stage-note" x="20" y="88">health and recovery</text>
    </g>

    <g class="motion-dot" pointer-events="none" fill="#ffffff" filter="url(#flow-glow)">
      <circle r="5" opacity="0">
        <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.02;0.12;0.17;1" dur="6s" repeatCount="indefinite" />
        <animateMotion path="M 252 138 H 292" keyPoints="0;1;1" keyTimes="0;0.15;1" calcMode="linear" dur="6s" repeatCount="indefinite" />
      </circle>
      <circle r="5" opacity="0">
        <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.02;0.12;0.17;1" dur="6s" begin="0.9s" repeatCount="indefinite" />
        <animateMotion path="M 522 138 H 542" keyPoints="0;1;1" keyTimes="0;0.15;1" calcMode="linear" dur="6s" begin="0.9s" repeatCount="indefinite" />
      </circle>
      <circle r="5" opacity="0" fill="#e86f2b">
        <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.02;0.12;0.17;1" dur="6s" begin="1.8s" repeatCount="indefinite" />
        <animateMotion path="M 648 192 V 238" keyPoints="0;1;1" keyTimes="0;0.15;1" calcMode="linear" dur="6s" begin="1.8s" repeatCount="indefinite" />
      </circle>
      <circle r="5" opacity="0" fill="#64d7c6">
        <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.02;0.12;0.17;1" dur="6s" begin="2.7s" repeatCount="indefinite" />
        <animateMotion path="M 524 304 H 484" keyPoints="0;1;1" keyTimes="0;0.15;1" calcMode="linear" dur="6s" begin="2.7s" repeatCount="indefinite" />
      </circle>
      <circle r="5" opacity="0" fill="#64d7c6">
        <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.02;0.12;0.17;1" dur="6s" begin="3.6s" repeatCount="indefinite" />
        <animateMotion path="M 254 304 H 234" keyPoints="0;1;1" keyTimes="0;0.15;1" calcMode="linear" dur="6s" begin="3.6s" repeatCount="indefinite" />
      </circle>
    </g>

    <rect x="36" y="408" width="704" height="72" rx="16" fill="#0d2a40" stroke="#2f536b" />
    <circle cx="62" cy="444" r="8" fill="#64d7c6" />
    <text class="sans" x="82" y="439" fill="#ffffff" font-size="16" font-weight="700">PostgreSQL stays authoritative</text>
    <text class="sans" x="82" y="462" fill="#9fb7c8" font-size="14">Redis and BullMQ coordinate replaceable at-least-once work.</text>
    <rect x="544" y="426" width="168" height="36" rx="9" fill="#173d59" stroke="#4a6d83" />
    <text class="sans" x="628" y="449" fill="#ffffff" font-size="13" font-weight="700" text-anchor="middle">AUDITABLE BY DESIGN</text>
  </g>
</svg>
